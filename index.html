<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Extractor Datos Llantas PDF + OCR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
        h1 { text-align: center; }
        .container { text-align: center; padding: 30px; }
        .upload-area {
            border: 2px dashed #007bff;
            padding: 40px; margin: 20px auto; 
            max-width: 500px;
            cursor: pointer;
            border-radius: 10px;
            background: white;
        }
        .upload-area:hover {background: #e3f2fd;}
        input[type="file"] {display:none;}
        button {
            margin: 10px;
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-primary { background: #28a745; color: white; }
        .btn-primary:hover { background: #218838; }
        .btn-secondary { background: #dc3545; color: white; }
        .btn-secondary:hover { background: #c82333; }
        .btn-disabled { background: #6c757d; cursor: not-allowed; }
        #status {
            margin: 25px auto;
            padding: 15px;
            max-width: 600px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            display: none;
        }
        .status-ready { background: #d4edda; color: #155724; }
        .status-processing { background: #fff3cd; color: #856404; }
        .status-error { background: #f8d7da; color: #721c24; }
        .status-ocr { background: #d1ecf1; color: #0c5460; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            background: white;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th { background: #007bff; color: white; }
        .progress-container {
            display: none;
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        .progress-text {
            text-align: center;
            font-size: 14px;
            color: #495057;
        }
        /* Modal para pedir el Nombre antes de enviar */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 420px;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }
        .modal-actions { text-align: right; margin-top: 12px; }
    </style>
</head>
<body>
    <h1>Escanea tus traspasos para ser más ágil el proceso</h1>
    <div class="container">
        <div class="upload-area" onclick="document.getElementById('pdfInput').click()">
            <p>📁 Haz clic o arrastra aquí para seleccionar tu PDF</p>
            <input type="file" id="pdfInput" accept=".pdf" />
        </div>
        <button id="btnStart" class="btn-primary btn-disabled" onclick="startScan()" disabled>🚀 INICIAR ESCANEO</button>
        <button id="btnClear" class="btn-secondary" onclick="clearAll()" style="display:none;">🗑️ LIMPIAR TODO</button>
    </div>
    <div id="status" class="status-ready">Esperando archivo PDF...</div>

    <div id="progressContainer" class="progress-container">
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
        <div class="progress-text">
            <span id="progressText">0%</span> - <span id="pageCounter">Página 0/0</span>
        </div>
    </div>

    <div id="result" style="display:none; max-width: 900px; margin: 20px auto; background:white; padding:10px; border-radius:10px;">
        <div style="text-align:center;">
            <button class="btn-primary" onclick="downloadCSV()">💾 DESCARGAR CSV</button>
            <button class="btn-primary" onclick="copyTable()">📋 COPIAR TABLA</button>
            <button id="btnSendSheet" class="btn-primary" onclick="openNameModal()">📤 ENVIAR A HOJA</button>
        </div>
        <div id="tableContainer"></div>
        <!-- Modal para pedir Nombre antes de enviar -->
        <div id="nameModal" class="modal">
            <div class="modal-content">
                <h3>Ingresa el nombre para la hoja</h3>
                <p>Este nombre se asignará a la columna <strong>traspasos/Nombre</strong> en la hoja.</p>
                <input id="sheetNameInput" type="text" placeholder="Nombre (ej. Sucursal A)" style="width:100%; padding:8px; font-size:16px;" />
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="closeNameModal()">Cancelar</button>
                    <button class="btn-primary" onclick="confirmSendToSheetDB()">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script>
        const pdfInput = document.getElementById('pdfInput');
        const btnStart = document.getElementById('btnStart');
        const btnClear = document.getElementById('btnClear');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const tableContainer = document.getElementById('tableContainer');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const pageCounter = document.getElementById('pageCounter');
        let extractedData = [];
        let currentFile = null;

        pdfInput.addEventListener('change', () => {
            if(pdfInput.files.length > 0) {
                currentFile = pdfInput.files[0];
                enableStart();
                showStatus('✅ Archivo PDF cargado. Listo para escanear.', 'status-ready');
            }
        });

        function enableStart() {
            btnStart.disabled = false;
            btnStart.classList.remove('btn-disabled');
        }

        function showStatus(message, statusClass) {
            statusDiv.style.display = 'block';
            statusDiv.textContent = message;
            statusDiv.className = statusClass;
        }

        async function startScan() {
            if(!currentFile) {
                alert('⚠️ Por favor selecciona un archivo PDF primero.');
                return;
            }
            btnStart.disabled = true;
            btnStart.classList.add('btn-disabled');
            showStatus('🔄 Escaneando PDF... por favor espera.', 'status-processing');
            progressContainer.style.display = 'block';

            try {
                const arrayBuffer = await currentFile.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                const pdf = await pdfjsLib.getDocument({data: uint8Array.slice()}).promise;
                let rawText = '';

                for(let i=1; i<=pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    rawText += content.items.map(item => item.str).join(' ') + '\n';
                    
                    // Actualizar barra de progreso
                    updateProgress(i, pdf.numPages);
                }

                // Detectar texto nativo para extraer directamente
                if(!textoTieneFormato(rawText)) {
                    showStatus('📸 PDF escaneado detectado. Iniciando OCR...', 'status-ocr');
                    console.log('⚠️ Activando OCR porque no se detectó texto nativo');
                    extractedData = await ocrPDF(currentFile, pdf.numPages);
                    // marcar progreso completo después de OCR
                    completeProgress();
                } else {
                    console.log('✅ Extrayendo de texto nativo (no OCR)');
                    extractedData = extraerProductos(rawText);
                    // marcar progreso completo después de extracción de texto
                    completeProgress();
                }

                if(extractedData.length === 0) {
                    showStatus('⚠️ No se encontraron productos. Verifica el PDF.', 'status-error');
                } else {
                    showStatus(`✅ Escaneo completado. ${extractedData.length} productos extraídos.`, 'status-ready');
                    displayTable();
                    btnClear.style.display = 'inline-block';
                }
                progressContainer.style.display = 'none';

            } catch(e) {
                console.error(e);
                showStatus('❌ Error procesando el PDF. Revisa el archivo y vuelve a intentarlo.', 'status-error');
                // Reset progress on error
                progressBar.style.width = '0%';
                progressText.textContent = '0%';
                pageCounter.textContent = '';
                progressContainer.style.display = 'none';
            }
            btnStart.disabled = false;
            btnStart.classList.remove('btn-disabled');
        }

        function updateProgress(current, total) {
            // Mostrar progreso parcial durante el procesamiento de páginas.
            // Para evitar que la barra llegue a 100% antes de completar la extracción/OCR,
            // limitamos el progreso a 90% durante el loop de páginas. El 100% se establece
            // explícitamente cuando todo el procesamiento ha finalizado.
            const percentage = Math.round((current / total) * 90);
            progressBar.style.width = percentage + '%';
            progressText.textContent = percentage + '%';
            pageCounter.textContent = `Página ${current}/${total}`;
        }

        function completeProgress() {
            progressBar.style.width = '100%';
            progressText.textContent = '100%';
        }

        function textoTieneFormato(texto) {
            // Detecta si el PDF tiene texto extraíble de alta calidad
            if(!texto || texto.length < 50) return false;
            
            // Buscar patrones de producto/artículo
            const tieneEncabezados = /producto|artículo|descripción|cantidad|código/i.test(texto);
            
            // Buscar al menos una línea con formato de producto (número + texto)
            const lineas = texto.split('\n');
            const tieneProductos = lineas.some(linea => {
                // Buscar líneas que empiezan con número seguido de más datos
                return /^\d+\s+\S+\s+.+/i.test(linea.trim());
            });
            
            // Considerar que tiene buen formato si:
            // - Tiene encabezados Y al menos 1 producto, O
            // - Tiene muchas líneas con formato de producto
            const conteoProductos = lineas.filter(l => /^\d+\s+\S+/.test(l.trim())).length;
            
            return (tieneEncabezados && tieneProductos) || conteoProductos >= 3;
        }

        function extraerProductos(texto) {
            const lineas = texto.split('\n');
            const productos = [];
            const productosSet = new Set(); // Para evitar duplicados exactos
            
            console.log('📝 Texto completo para extracción:', texto.substring(0, 500));
            console.log('📊 Total de líneas a procesar:', lineas.length);
            
            // Palabras clave para filtrar líneas innecesarias
            const palabrasExcluidas = ['producto', 'cantidad', 'código', 'descripción', 'código', 'total', 'subtotal', 
                                      'iva', 'neto', 'página', 'factura', 'invoice', 'referencia', 'unitario', 'precio',
                                      'articulo', 'item', 'importe', 'unit', 'fecha', 'empresa', 'nombre', 'encabezado'];
            
            for(let i = 0; i < lineas.length; i++) {
                let linea = lineas[i].trim();
                
                // Saltar líneas vacías o muy cortas
                if(!linea || linea.length < 2) continue;
                
                // Saltar líneas que son SOLO palabras clave
                const esEncabezado = palabrasExcluidas.some(palabra => 
                    linea.toUpperCase() === palabra.toUpperCase() || 
                    linea.toUpperCase().startsWith(palabra.toUpperCase() + ' ') ||
                    linea.toUpperCase().endsWith(' ' + palabra.toUpperCase())
                );
                if(esEncabezado) continue;
                
                let match = null;
                let cantidad = null;
                let codigo = null;
                let descripcion = null;
                
                // Patrón 1: "número  código  descripción" (espacios múltiples)
                match = linea.match(/^(\d+)\s{2,}([A-Z0-9\-]{2,})\s{2,}(.{2,})$/i);
                if(match) {
                    cantidad = parseInt(match[1], 10);
                    codigo = match[2].trim();
                    descripcion = match[3].trim();
                }
                
                // Patrón 2: "número código descripción" (espacios normales, código alfanumérico)
                if(!match) {
                    match = linea.match(/^(\d+)\s+([A-Z0-9\-\.]+)\s+(.{2,})$/i);
                    if(match) {
                        cantidad = parseInt(match[1], 10);
                        codigo = match[2].trim();
                        descripcion = match[3].trim();
                    }
                }
                
                // Patrón 3: "número  palabra  palabra  palabra" (muy flexible, código = primera palabra)
                if(!match) {
                    match = linea.match(/^(\d+)\s+(\S+)\s+(.{2,})$/i);
                    if(match) {
                        cantidad = parseInt(match[1], 10);
                        codigo = match[2].trim();
                        descripcion = match[3].trim();
                    }
                }
                
                // Patrón 4: Línea con número inicial (al menos 3 caracteres más)
                if(!match && /^\d+\s/.test(linea) && linea.length > 5) {
                    match = linea.match(/^(\d+)\s+(.+)$/);
                    if(match && match[2].length >= 3) {
                        cantidad = parseInt(match[1], 10);
                        const resto = match[2].trim();
                        const palabras = resto.split(/\s+/);
                        
                        if(palabras.length >= 2) {
                            codigo = palabras[0];
                            descripcion = palabras.slice(1).join(' ');
                        } else if(palabras.length === 1 && resto.length > 3) {
                            codigo = resto.substring(0, Math.min(10, resto.length));
                            descripcion = resto;
                        }
                    }
                }
                
                // Validaciones MENOS estrictas
                if(cantidad !== null && codigo && descripcion) {
                    // Validar cantidad
                    if(isNaN(cantidad) || cantidad < 1 || cantidad > 999999) continue;
                    
                    // Validar código (muy flexible ahora)
                    codigo = codigo.trim();
                    if(codigo.length < 1) continue;
                    if(/^[\d\s\-\.]+$/.test(codigo) && codigo.length < 3) continue; // Solo números y separadores
                    
                    // Validar descripción
                    descripcion = descripcion.trim();
                    if(descripcion.length < 2) continue;
                    if(/^[\d\-\._\s]+$/.test(descripcion)) continue; // Solo números y símbolos
                    
                    // Crear clave única para evitar duplicados exactos
                    const clave = `${cantidad}|${codigo}|${descripcion}`.toLowerCase();
                    if(productosSet.has(clave)) continue;
                    
                    console.log(`✅ Producto encontrado: ${cantidad} | ${codigo} | ${descripcion}`);
                    
                    productos.push({
                        cantidad: cantidad,
                        codigo: codigo,
                        descripcion: descripcion
                    });
                    
                    productosSet.add(clave);
                }
            }
            
            console.log(`📦 Total productos EXTRAÍDOS: ${productos.length}`);
            return productos;
        }

        async function ocrPDF(file, numPages) {
            const arrayBuffer = await file.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);
            const pdf = await pdfjsLib.getDocument({data: uint8Array}).promise;
            
            let allText = '';
            
            for(let i=1; i<=numPages; i++) {
                const page = await pdf.getPage(i);
                
                // Aumentar escala para mejor OCR
                const viewport = page.getViewport({scale: 3.0});
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({canvasContext: ctx, viewport}).promise;
                
                // Mejorar contraste del canvas antes de OCR
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // Aplicar contraste para mejorar OCR
                for(let j = 0; j < data.length; j += 4) {
                    const avg = (data[j] + data[j+1] + data[j+2]) / 3;
                    const contrast = avg > 128 ? 255 : 0;
                    data[j] = contrast;
                    data[j+1] = contrast;
                    data[j+2] = contrast;
                }
                ctx.putImageData(imageData, 0, 0);
                
                const { data: { text } } = await Tesseract.recognize(canvas, 'spa');
                
                allText += text + '\n';
                
                // Actualizar barra de progreso durante OCR
                updateProgress(i, numPages);
            }
            
            console.log('🔍 Texto OCR bruto (primeros 1000 caracteres):', allText.substring(0, 1000));
            
            // Limpiar el texto OCR para mejorar extracción - MENOS AGRESIVO
            // Mantener estructura de líneas pero normalizar espacios
            allText = allText
                .split('\n')
                .map(linea => linea.trim())
                .filter(linea => linea.length > 0)
                .join('\n');
            
            console.log('🔍 Texto OCR limpio (primeros 1000 caracteres):', allText.substring(0, 1000));
            
            // Extraer productos del texto OCR completo
            const datosPage = extraerProductos(allText);
            return datosPage;
        }

        function displayTable() {
            if(extractedData.length === 0) {
                console.warn('⚠️ No hay datos para mostrar. extractedData:', extractedData);
                return;
            }
            
            resultDiv.style.display = 'block';
            let totalCantidad = extractedData.reduce((acc, val) => acc + (val.cantidad || 0), 0);

            let html = `<h3>📋 ${extractedData.length} productos encontrados | Total unidades: ${totalCantidad}</h3>
                        <table>
                            <thead>
                                <tr><th>CANTIDAD</th><th>CÓDIGO</th><th>DESCRIPCIÓN</th></tr>
                            </thead>
                            <tbody>
                            ${extractedData.map((d, idx) => `
                                <tr>
                                    <td>${d.cantidad || 0}</td>
                                    <td>${d.codigo || 'N/A'}</td>
                                    <td>${d.descripcion || 'N/A'}</td>
                                </tr>
                            `).join('')}
                            </tbody>
                        </table>`;
            
            tableContainer.innerHTML = html;
            console.log('✅ Tabla mostrada. Datos:', extractedData);
        }

        function downloadCSV() {
            if(extractedData.length === 0) return;
            const csv = ['Cantidad,Codigo,Descripcion', ...extractedData.map(d =>
                `${d.cantidad},"${d.codigo}","${d.descripcion.replace(/"/g,'""')}"`
            )].join('\n');

            const blob = new Blob([csv], {type:'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `llantas_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        function copyTable() {
            if(extractedData.length === 0) return;
            const text = extractedData.map(d => `${d.cantidad}\t${d.codigo}\t${d.descripcion}`).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('¡Tabla copiada al portapapeles!');
            });
        }

        // Modal control: abrir/cerrar
        function openNameModal() {
            const modal = document.getElementById('nameModal');
            const input = document.getElementById('sheetNameInput');
            input.value = '';
            modal.style.display = 'flex';
            input.focus();
        }

        function closeNameModal() {
            const modal = document.getElementById('nameModal');
            modal.style.display = 'none';
        }

        // Confirmar y enviar a SheetDB
        async function confirmSendToSheetDB() {
            const input = document.getElementById('sheetNameInput');
            const nombre = (input.value || '').trim();
            if(!nombre) {
                alert('Por favor ingresa un nombre válido.');
                input.focus();
                return;
            }
            closeNameModal();
            await sendToSheetDB(nombre);
        }

        async function sendToSheetDB(nombre) {
            if(!extractedData || extractedData.length === 0) {
                alert('No hay datos para enviar.');
                return;
            }

            // Construir filas: rellenar solo lo que tenemos, demás como cadena vacía
            const rows = extractedData.map(item => ({
                'traspasos/Nombre': nombre,
                'Folio': '',
                'Fecha de Emisión': '',
                'Usuario': '',
                'Cantidad': item.cantidad != null ? String(item.cantidad) : '',
                'Código': item.codigo || '',
                'Descripción': item.descripcion || ''
            }));

            try {
                showStatus('🔄 Enviando datos a la hoja...','status-processing');

                // Enviar explícitamente a la hoja llamada "traspasos"
                const res = await fetch('https://sheetdb.io/api/v1/4d1d7wqnkoi7b?sheet=traspasos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: rows })
                });

                if(!res.ok) {
                    const errText = await res.text();
                    console.error('SheetDB error:', res.status, errText);
                    showStatus('❌ Error al enviar: ' + res.status, 'status-error');
                    alert('Error al enviar los datos. Revisa la consola para más detalles.');
                    return;
                }

                const json = await res.json();
                console.log('SheetDB response', json);
                showStatus('✅ Datos enviados correctamente a la hoja "traspasos".', 'status-ready');
                alert('Datos enviados correctamente a la hoja "traspasos".');
            } catch (e) {
                console.error('Error al enviar a SheetDB', e);
                showStatus('❌ Error al enviar los datos.', 'status-error');
                alert('Ocurrió un error al enviar los datos. Revisa la consola.');
            }
        }

        function clearAll() {
            extractedData = [];
            pdfInput.value = '';
            resultDiv.style.display = 'none';
            tableContainer.innerHTML = '';
            btnClear.style.display = 'none';
            btnStart.disabled = true;
            btnStart.classList.add('btn-disabled');
            showStatus('Esperando archivo PDF...', 'status-ready');
        }
    </script>
</body>
</html>
